[package]
name = "eye-lab"
description = "Headless hardware and pipeline test runner: camera modes and test sequences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "eye-lab"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossbeam-channel.workspace = true
eye.workspace = true
eye-bench.workspace = true
eye-capture.workspace = true
eye-core.workspace = true
eye-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
nix = { workspace = true, features = ["signal"] }
predicates.workspace = true
tempfile.workspace = true

[features]
default = ["ir-classic", "mediapipe-ort"]
ir-classic = ["eye/ir-classic"]
mediapipe-ort = ["eye/mediapipe-ort"]
mediapipe-tract = ["eye/mediapipe-tract"]

[lints]
workspace = true
