[package]
name = "eye-app"
description = "The eye command-line application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[lib]
name = "eye_app"
path = "src/lib.rs"

[[bin]]
name = "eye"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
eye.workspace = true
eye-bench.workspace = true
eye-calibration.workspace = true
eye-capture.workspace = true
eye-core.workspace = true
eye-detect.workspace = true
eye-geometry.workspace = true
eye-log.workspace = true
eye-overlay.workspace = true
eye-platform.workspace = true
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
eye-bench = { workspace = true, features = ["testing"] }
nix = { workspace = true, features = ["signal"] }
predicates.workspace = true
tempfile.workspace = true

[features]
default = ["ir-classic", "mediapipe-ort"]
ir-classic = ["eye/ir-classic"]
mediapipe-ort = ["eye/mediapipe-ort"]
mediapipe-tract = ["eye/mediapipe-tract"]

[lints]
workspace = true
