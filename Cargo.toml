[workspace]
resolver = "3"
members = [
    "crates/eye-core",
    "crates/eye-geometry",
    "crates/eye-platform",
    "crates/eye-capture",
    "crates/eye-detect",
    "crates/eye-estimate",
    "crates/eye-calibration",
    "crates/eye-filter",
    "crates/eye-overlay",
    "crates/eye",
    "crates/eye-bench",
    "crates/eye-app",
    "crates/eye-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Max Emil Yoon Blomstervall"]
license = "Apache-2.0"
description = "Webcam gaze tracking with a pluggable pipeline and a Wayland overlay"
publish = false
repository = "https://github.com/fulsomenko/eye"
homepage = "https://github.com/fulsomenko/eye"

[workspace.dependencies]
eye-core = { path = "crates/eye-core" }
eye-geometry = { path = "crates/eye-geometry" }
eye-platform = { path = "crates/eye-platform" }
eye-capture = { path = "crates/eye-capture" }
eye-detect = { path = "crates/eye-detect", default-features = false }
eye-estimate = { path = "crates/eye-estimate" }
eye-calibration = { path = "crates/eye-calibration" }
eye-filter = { path = "crates/eye-filter" }
eye-overlay = { path = "crates/eye-overlay" }
eye = { path = "crates/eye", default-features = false }
eye-bench = { path = "crates/eye-bench" }

nalgebra = { version = "0.34", features = ["serde-serialize"] }
levenberg-marquardt = "0.15"

v4l = "0.14"
nix = "0.30"

zune-jpeg = "0.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "load-dynamic", "api-27"] }
tract-onnx = { version = "0.23", default-features = false }

smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1"
etcetera = "0.10"

crossbeam-channel = "0.5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
signal-hook = "0.3.18"

approx = "0.5"
proptest = "1"
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
float_cmp = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
